name: Code Freeze

# 指定した時間帯だけ、リポジトリの全ブランチをロック（読み取り専用にし、
# 直接pushもPRのマージも一切できない状態）する。
#
#   2026-08-02 21:50–22:00 JST … 動作確認用の試験ウィンドウ
#   2026-08-03 10:00–20:00 JST … 本番のコードフリーズウィンドウ
#
# 開始時刻に lock、終了時刻に unlock がそれぞれ自動実行される
# （github.event.schedule で、どのcronが発火したかを見て action を決めている）。
#
# 手動での動作確認・解除は Actions タブから「Run workflow」で action を
# 選んで実行できる（lock / unlock）。
#
# ⚠️ 必須: GITHUB_TOKEN には branch protection を更新する権限（administrationスコープ）が
# 存在しない。このワークフローは必ず PAT（classic、repoスコープ）をシークレットとして使う。
# リポジトリの「Settings → Secrets and variables → Actions」から
# 「ADMIN_TOKEN」という名前で PAT（対象リポジトリの Administration: Read and write）を
# 登録しておく必要がある。
#
# ⚠️ GitHub Actions の schedule トリガーは、指定時刻ちょうどではなく数分〜十数分の
# 遅延が発生することがある（公式に明言されている既知の挙動）。ずれた場合に備えて、
# 想定どおりロック/解除されているかは都度 Actions タブで確認すること。

on:
  schedule:
    # 2026-08-02 12:50 UTC = 2026-08-02 21:50 JST（試験・開始＝lock）
    - cron: '50 12 2 8 *'
    # 2026-08-02 13:00 UTC = 2026-08-02 22:00 JST（試験・終了＝unlock）
    - cron: '0 13 2 8 *'
    # 2026-08-03 01:00 UTC = 2026-08-03 10:00 JST（本番・開始＝lock）
    - cron: '0 1 3 8 *'
    # 2026-08-03 11:00 UTC = 2026-08-03 20:00 JST（本番・終了＝unlock）
    - cron: '0 11 3 8 *'
  workflow_dispatch:
    inputs:
      action:
        description: '実行内容'
        required: true
        default: 'lock'
        type: choice
        options:
          - lock
          - unlock

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Determine action
        id: vars
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_ACTION: ${{ github.event.inputs.action }}
        run: |
          case "$SCHEDULE" in
            "50 12 2 8 *"|"0 1 3 8 *") ACTION=lock ;;
            "0 13 2 8 *"|"0 11 3 8 *") ACTION=unlock ;;
            *) ACTION="${DISPATCH_ACTION:-lock}" ;;
          esac
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Lock or unlock all branches
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ACTION: ${{ steps.vars.outputs.action }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ADMIN_TOKEN secretが未設定です。Settings → Secrets and variables → Actions から repo スコープのPAT(classic)を登録してください"
            exit 1
          fi
          if [ "$ACTION" = "lock" ]; then
            LOCK_VALUE=true
          else
            LOCK_VALUE=false
          fi

          branches=$(gh api "repos/${{ github.repository }}/branches?per_page=100" --paginate --jq '.[].name')

          for b in $branches; do
            echo "== ${ACTION} branch: $b =="
            gh api --method PUT "repos/${{ github.repository }}/branches/$b/protection" \
              --input - <<EOF
          {
            "required_status_checks": null,
            "enforce_admins": true,
            "required_pull_request_reviews": null,
            "restrictions": null,
            "lock_branch": ${LOCK_VALUE}
          }
          EOF
          done

          echo "### Code Freeze: ${ACTION} 完了 (対象ブランチ: $(echo "$branches" | wc -l)件)" >> "$GITHUB_STEP_SUMMARY"
