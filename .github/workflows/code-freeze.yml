name: Code Freeze

# ハッカソンのコードフリーズを自動実行する。
# 2026-08-03 10:00 JST (= 2026-08-03 01:00 UTC) に、リポジトリの全ブランチを
# ロック（読み取り専用）し、直接pushもPRのマージも一切できない状態にする。
#
# 手動での動作確認・解除は Actions タブから「Run workflow」で action を
# 選んで実行できる（lock / unlock）。

on:
  schedule:
    # 2026-08-03 01:00 UTC = 2026-08-03 10:00 JST
    - cron: '0 1 3 8 *'
  workflow_dispatch:
    inputs:
      action:
        description: '実行内容'
        required: true
        default: 'lock'
        type: choice
        options:
          - lock
          - unlock

permissions:
  administration: write
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Determine action
        id: vars
        run: echo "action=${{ github.event.inputs.action || 'lock' }}" >> "$GITHUB_OUTPUT"

      - name: Lock or unlock all branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ steps.vars.outputs.action }}
        run: |
          set -e
          if [ "$ACTION" = "lock" ]; then
            LOCK_VALUE=true
          else
            LOCK_VALUE=false
          fi

          branches=$(gh api "repos/${{ github.repository }}/branches?per_page=100" --paginate --jq '.[].name')

          for b in $branches; do
            echo "== ${ACTION} branch: $b =="
            gh api --method PUT "repos/${{ github.repository }}/branches/$b/protection" \
              --input - <<EOF
          {
            "required_status_checks": null,
            "enforce_admins": true,
            "required_pull_request_reviews": null,
            "restrictions": null,
            "lock_branch": ${LOCK_VALUE}
          }
          EOF
          done

          echo "### Code Freeze: ${ACTION} 完了 (対象ブランチ: $(echo "$branches" | wc -l)件)" >> "$GITHUB_STEP_SUMMARY"
