name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このプルリクエストをレビューしてください。ハッカソンで開発している学生向けのプロジェクトです。
            初めてPRを書く人も多いので、指摘は具体的かつ親切な言い回しにしてください。

            重点的に見てほしい点:
            1. ロジックの誤り・見落としているエッジケース
            2. セキュリティ上の懸念（パストラバーサル、インジェクションなど）
            3. ファイル操作の安全性（ユーザーのファイルを失う・壊す可能性がないか）
            4. エラーハンドリングの漏れ

            スタイルの好みやテスト不足だけの指摘は行わず、実際に問題になりうる箇所のみ
            具体的な行番号付きのインラインコメントで指摘してください。
            問題が無ければ、その旨を短く伝えるだけで構いません。

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
